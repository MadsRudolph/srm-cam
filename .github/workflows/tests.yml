# Test CI for SRM-CAM.
#
# Two jobs, deliberately:
#
#   locked  - runs the suite against packaging/requirements-lock.txt, the exact
#             versions the shipped installer is built from. This one gates
#             pushes and PRs: if it is red, the app we ship is broken.
#
#   canary  - runs the same suite against the NEWEST Python and the NEWEST
#             releases of every dependency, once a month. Nothing gates on it.
#             Its job is to answer the question "will this still build in a few
#             years?" before the answer matters: when a new PySide6, numpy or
#             Python release breaks us, this turns red on the 1st of the month
#             and emails whoever owns the repo, instead of the breakage being
#             discovered by a student the week before a deadline.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 1 * *"      # 06:00 UTC on the 1st — the canary
  workflow_dispatch:

permissions:
  contents: read

env:
  # The GUI tests build real widgets; there is no display and no GPU on a
  # runner. offscreen gives Qt a windowless platform plugin, and software
  # forces the bundled Mesa (opengl32sw.dll) for the pyqtgraph 3D views.
  QT_QPA_PLATFORM: offscreen
  QT_OPENGL: software

jobs:
  locked:
    # The gating job: exactly what we ship.
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packaging/requirements-lock.txt

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r packaging/requirements-lock.txt
          python -m pip install pytest==9.1.1     # pinned like everything else
          python -m pip install -e . --no-deps

      - name: Check version consistency
        run: python scripts/check_version.py

      - name: Run tests
        run: python -m pytest -q

  canary:
    # Early warning only — never gates a merge.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"    # whatever the newest stable Python is

      - name: Install newest everything
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[gui,dev]"

      - name: Record the versions this ran against
        run: python -m pip freeze

      - name: Run tests
        run: python -m pytest -q
