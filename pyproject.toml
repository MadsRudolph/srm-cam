[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gerber2rml"
version = "0.4.0"
description = "Gerber/Excellon to RML CAM tool for the Roland SRM-20"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "gerbonara>=1.0",
    "shapely>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]
gui = [
    "PySide6>=6.5",
    "matplotlib>=3.7",
    "pyqtgraph>=0.13",
    "PyOpenGL>=3.1",
    "pyserial>=3.5",   # SPI bed-probing over the Arduino serial link
    "qrcode>=7.0",     # phone photo hand-off QR (matrix only, no PIL)
]

[project.scripts]
gerber2rml-cli = "gerber2rml.cli:main"
gerber2rml-doctor = "gerber2rml.doctor:main"

[project.gui-scripts]
gerber2rml = "gerber2rml.gui.app:main"
# The second interface, installed alongside the first so the two can be run
# against the same engine at the same time and compared on a real job.
srm-cam = "gerber2rml.gui2.app:main"

[tool.setuptools.packages.find]
include = ["gerber2rml*"]

